# ──────────────────────────────────────────────────────────────
# NTR26 — FSMApp Module Registration
# ──────────────────────────────────────────────────────────────
# Per CLAUDE.md §4 (P2), every FSMApp module is registered here
# before it can be loaded by the framework.
#
# Status: scaffold — no FSMApp services registered yet.
# Modules are appended as they come online during porting.
# ──────────────────────────────────────────────────────────────

# Application identity
service.name=NTR26 Platform
application.package=com.mobileum.ntr

# Logging defaults — overridden per module as they register.
# (CLAUDE.md P4 — Log4j2 mandatory; this is FSMApp's own logging config,
#  separate from Log4j2 which configures application logging.)
log.required=yes
log.prefix=ntr
log.extn=log
log.directory=logs/ntr
log.level=2
log.rotation.type=1
log.max.size=5120000
